<tspan x="10" y="103"> │                                                                │</tspan>
<tspan x="10" y="119"> │ chloe · software engineer · melbourne                          │</tspan>
<tspan x="10" y="135"> │ usage: chloe [--deep-end] &lt;new-domain&gt;                         │</tspan>
<tspan x="10" y="151"> │                                                                │</tspan>
<tspan x="10" y="167"> │ commands:                                                      │</tspan>
<tspan x="10" y="183"> │   ship       end-to-end                                        │</tspan>
<tspan x="10" y="199"> │   frontend   typescript, react, next.js, remix, tailwind, d3   │</tspan>
<tspan x="10" y="215"> │   backend    python, fastapi, rest apis                        │</tspan>
<tspan x="10" y="231"> │   database   postgresql, supabase, dbt                         │</tspan>
<tspan x="10" y="247"> │   ai         llm apis, embeddings, vector search                </tspan>
<tspan x="10" y="263"> │   infra      vercel, railway, graphite, github actions          </tspan>
<tspan x="10" y="279"> │                                                                │</tspan>
<tspan x="10" y="295"> │ off-duty commands:                                              </tspan>
<tspan x="10" y="311"> │   lift       many heavy circles                                │</tspan>
<tspan x="10" y="327"> │   smash      shuttles after shuttles                            </tspan>
<tspan x="10" y="343"> │   dance      strut and slay                                     </tspan>
<tspan x="10" y="359"> │   cook       macros in, magic out                               </tspan>
<tspan x="10" y="375"> │                                                                │</tspan>
<tspan x="10" y="391"> │ $ chloe --motd                                                  </tspan>
<tspan x="10" y="407"> │ "the more i learn, the more i realise how much i don't know."  │</tspan>
