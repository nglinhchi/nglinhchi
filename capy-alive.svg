<tspan x="10" y="23"> ╭────────────────────────────────────────────────────────────────╮</tspan>
<tspan x="10" y="39"> │ <tspan fill="#ff5f56">●</tspan> <tspan fill="#ffbd2e">●</tspan> <tspan fill="#27c93f">●</tspan>                                            chloe ~ zsh   │</tspan>
