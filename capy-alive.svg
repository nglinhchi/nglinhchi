<svg xmlns="http://www.w3.org/2000/svg" width="944" height="658" viewBox="0 0 944 658" role="img" aria-label="chloe terminal with capybara in a flower garden">
<style>
text { fill: #c9d1d9; }
.capy { fill: #b08850; }
.cursor { fill: #c9d1d9; }
.gback { fill: #3f7d4e; }
.gfront, .stem { fill: #5aa66a; }
.fpink { fill: #ff9ecb; }
.flav { fill: #b79bff; }
.fyellow, .sparkle { fill: #ffd66b; }
.fwhite { fill: #fff0f5; }
@media (prefers-color-scheme: light) {
  text { fill: #24292f; }
  .capy { fill: #8a6a3a; }
  .cursor { fill: #24292f; }
  .gback { fill: #2f6b3e; }
  .gfront, .stem { fill: #4a9159; }
  .fpink { fill: #e87fb1; }
  .flav { fill: #9a7ce8; }
  .fyellow, .sparkle { fill: #e3a93f; }
  .fwhite { fill: #caa0c0; }
}
</style>

